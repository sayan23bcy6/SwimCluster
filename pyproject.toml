[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "swimcluster"
version         = "0.1.0"
description     = "Self-healing cluster membership system using the SWIM protocol"
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "MIT" }

dependencies = [
    "aiohttp>=3.9",
    "prometheus_client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
swimcluster = "swimcluster.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swimcluster*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.setuptools]
package-dir = {"" = "."}
