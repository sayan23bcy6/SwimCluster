# ── Prometheus configuration ──────────────────────────────────────────────────
# Scrapes /metrics from all 5 SwimCluster nodes every 5 seconds.

global:
  scrape_interval:     5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "swimcluster"
    static_configs:
      - targets:
          - "node1:8080"
          - "node2:8080"
          - "node3:8080"
          - "node4:8080"
          - "node5:8080"
    metrics_path: "/metrics"
    relabel_configs:
      # Add a 'node' label derived from the target host name.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: node
        replacement: "$1"
